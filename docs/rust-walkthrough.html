<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rust Walkthrough — src/main.rs</title>
  <style>
    :root {
      --bg: #0e1116;
      --surface: #151a22;
      --surface-2: #1c222d;
      --border: #262e3d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #f78166;
      --accent-soft: rgba(247, 129, 102, 0.14);
      --accent-border: rgba(247, 129, 102, 0.45);
      --highlight-bg: rgba(88, 166, 255, 0.12);
      --highlight-border: rgba(88, 166, 255, 0.55);
      --code-bg: #0b0e13;

      /* Syntax colors (dark) */
      --syn-kw: #ff7b72;
      --syn-type: #ffa657;
      --syn-fn: #d2a8ff;
      --syn-str: #a5d6ff;
      --syn-num: #79c0ff;
      --syn-macro: #7ee787;
      --syn-attr: #8b949e;
      --syn-op: #c9d1d9;

      /* Concept tag colors */
      --c-modules: #79c0ff;
      --c-ownership: #ff7b72;
      --c-types: #ffa657;
      --c-traits: #d2a8ff;
      --c-macros: #7ee787;
      --c-expr: #f2cc60;
      --c-deref: #56d4dd;
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f0f3f7;
      --border: #d8dee4;
      --text: #1f2328;
      --text-muted: #59636e;
      --accent: #cf4b27;
      --accent-soft: rgba(207, 75, 39, 0.1);
      --accent-border: rgba(207, 75, 39, 0.4);
      --highlight-bg: rgba(9, 105, 218, 0.08);
      --highlight-border: rgba(9, 105, 218, 0.45);
      --code-bg: #ffffff;

      --syn-kw: #cf222e;
      --syn-type: #953800;
      --syn-fn: #8250df;
      --syn-str: #0a3069;
      --syn-num: #0550ae;
      --syn-macro: #116329;
      --syn-attr: #6e7781;
      --syn-op: #24292f;

      --c-modules: #0550ae;
      --c-ownership: #cf222e;
      --c-types: #953800;
      --c-traits: #8250df;
      --c-macros: #116329;
      --c-expr: #9a6700;
      --c-deref: #0969da;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kbd-hint {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    kbd {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-right: 4px;
      white-space: nowrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .pill:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .pill.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .pill .count {
      font-size: 11px;
      opacity: 0.7;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Main Split Pane */
    main {
      display: grid;
      grid-template-columns: minmax(420px, 1.05fr) minmax(380px, 0.95fr);
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 48vh 1fr;
      }
      .kbd-hint { display: none; }
    }

    /* Left Code Pane */
    .code-pane {
      display: flex;
      flex-direction: column;
      background: var(--code-bg);
      border-right: 1px solid var(--border);
      min-height: 0;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .file-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      font-weight: 500;
    }

    .code-scroll {
      overflow: auto;
      flex: 1;
      padding: 12px 0 32px;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      padding: 2px 16px 2px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.65;
      border-left: 3px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .code-line.annotated {
      cursor: pointer;
    }

    .code-line.annotated:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    [data-theme="light"] .code-line.annotated:hover {
      background: rgba(0, 0, 0, 0.035);
    }

    .code-line.filter-match {
      background: var(--highlight-bg);
      border-left-color: var(--highlight-border);
    }

    .code-line.filter-dim {
      opacity: 0.35;
    }

    .code-line.selected {
      background: var(--accent-soft) !important;
      border-left-color: var(--accent) !important;
      opacity: 1 !important;
    }

    .ln {
      width: 44px;
      text-align: right;
      padding-right: 14px;
      color: var(--text-muted);
      user-select: none;
      flex-shrink: 0;
      font-size: 12px;
      opacity: 0.65;
    }

    .code-line.selected .ln {
      color: var(--accent);
      opacity: 1;
      font-weight: 600;
    }

    .code-text {
      white-space: pre;
      flex: 1;
    }

    .line-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 10px;
      align-self: center;
      flex-shrink: 0;
    }

    .line-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0.75;
    }

    /* Syntax classes */
    .kw { color: var(--syn-kw); }
    .ty { color: var(--syn-type); }
    .fn { color: var(--syn-fn); }
    .str { color: var(--syn-str); }
    .num { color: var(--syn-num); }
    .mac { color: var(--syn-macro); }
    .attr { color: var(--syn-attr); }

    /* Right Inspector Pane */
    .inspector-pane {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-height: 0;
    }

    .inspector-body {
      overflow-y: auto;
      flex: 1;
      padding: 20px 24px 32px;
    }

    .line-banner {
      margin-bottom: 18px;
    }

    .line-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .line-title {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .line-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      font-weight: 600;
    }

    .snippet-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.55;
      overflow-x: auto;
      white-space: pre;
      margin-bottom: 12px;
    }

    .line-summary {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .tag:hover {
      border-color: var(--text-muted);
    }

    /* Concept Cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .token-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .card-concept {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .card p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--text);
    }

    .card code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .callout {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    .callout strong {
      color: var(--text);
    }

    /* Inspector Footer Nav */
    .inspector-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .progress-text {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    @media print {
      .app { height: auto; }
      header, .filter-bar, .inspector-footer { display: none; }
      main { display: block; }
      .code-pane { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-badge">rs</div>
        <div>
          <h1>Rust Interactive Walkthrough</h1>
          <p>Line-by-line syntax &amp; language features in <code>src/main.rs</code> (Bevy 0.20 · Rust 2024)</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="kbd-hint">
          <span>Navigate:</span>
          <kbd>↑</kbd><kbd>↓</kbd> or <kbd>j</kbd><kbd>k</kbd>
        </div>
        <button class="btn" id="themeToggle" type="button">Light theme</button>
      </div>
    </header>

    <div class="filter-bar" id="filterBar">
      <span class="filter-label">Concepts</span>
    </div>

    <main>
      <section class="code-pane" aria-label="Source code">
        <div class="pane-header">
          <span class="file-path">src/main.rs</span>
          <span id="filterStatus">Click any highlighted line to inspect</span>
        </div>
        <div class="code-scroll" id="codeContainer"></div>
      </section>

      <section class="inspector-pane" aria-label="Line explanation">
        <div class="pane-header">
          <span>Explanation</span>
          <span id="sectionLabel"></span>
        </div>
        <div class="inspector-body" id="inspectorBody"></div>
        <div class="inspector-footer">
          <span class="progress-text" id="progressText"></span>
          <div class="nav-btns">
            <button class="btn" id="prevBtn" type="button">← Previous</button>
            <button class="btn" id="nextBtn" type="button">Next →</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const CONCEPTS = {
      modules:   { label: "Modules & Paths",        color: "var(--c-modules)" },
      ownership: { label: "Ownership & Borrowing",  color: "var(--c-ownership)" },
      types:     { label: "Types & Structs",        color: "var(--c-types)" },
      traits:    { label: "Traits & Generics",      color: "var(--c-traits)" },
      macros:    { label: "Macros & Attributes",    color: "var(--c-macros)" },
      expr:      { label: "Expressions & Control",  color: "var(--c-expr)" },
      deref:     { label: "Smart Pointers & Deref", color: "var(--c-deref)" }
    };

    // Exact source of src/main.rs (lines 1..54)
    const SOURCE_LINES = [
      `use bevy::{curve::derivatives, prelude::*};`,
      ``,
      `fn main() {`,
      `    App::new()`,
      `        .add_plugins(DefaultPlugins)`,
      `        .add_plugins(HelloPlugin)`,
      `        .run();`,
      `}`,
      ``,
      `pub struct HelloPlugin;`,
      ``,
      `impl Plugin for HelloPlugin {`,
      `    fn build(&self, app: &mut App) {`,
      `        app.insert_resource(GreetTimer(Timer::from_seconds(2.0, TimerMode::Repeating)));`,
      `        app.add_systems(Startup, add_people);`,
      `        app.add_systems(Update, (update_people, greet_people).chain());`,
      `    }`,
      `}`,
      ``,
      `#[derive(Component)]`,
      `struct Person;`,
      ``,
      `#[derive(Component)]`,
      `struct Name(String);`,
      ``,
      `fn add_people(mut commands: Commands) {`,
      `    commands.spawn((Person, Name("Elaina Proctor".to_string())));`,
      `    commands.spawn((Person, Name("Renzo Hume".to_string())));`,
      `    commands.spawn((Person, Name("Zayna Nieves".to_string())));`,
      `}`,
      ``,
      `fn update_people(mut query: Query<&mut Name, With<Person>>) {`,
      `    for mut name in &mut query {`,
      `        if name.0 == "Elaina Proctor" {`,
      `            name.0 = "Elaina Hume".to_string();`,
      `            break;`,
      `        }`,
      `    }`,
      `}`,
      ``,
      `#[derive(Resource)]`,
      `struct GreetTimer(Timer);`,
      ``,
      `fn greet_people(time: Res<Time>, mut timer: ResMut<GreetTimer>, query: Query<&Name, With<Person>>) {`,
      `    if timer.0.tick(time.delta()).just_finished() {`,
      `        for name in &query {`,
      `            println!("hello {}", name.0)`,
      `        }`,
      `    }`,
      `}`,
      ``,
      `fn hello_world() {`,
      `    println!("hello world!")`,
      `}`
    ];

    // Pre-highlighted HTML for each line (keeps rendering fast & exact)
    const HIGHLIGHTED_LINES = [
      `<span class="kw">use</span> bevy::{curve::derivatives, prelude::*};`,
      ``,
      `<span class="kw">fn</span> <span class="fn">main</span>() {`,
      `    <span class="ty">App</span>::<span class="fn">new</span>()`,
      `        .<span class="fn">add_plugins</span>(<span class="ty">DefaultPlugins</span>)`,
      `        .<span class="fn">add_plugins</span>(<span class="ty">HelloPlugin</span>)`,
      `        .<span class="fn">run</span>();`,
      `}`,
      ``,
      `<span class="kw">pub</span> <span class="kw">struct</span> <span class="ty">HelloPlugin</span>;`,
      ``,
      `<span class="kw">impl</span> <span class="ty">Plugin</span> <span class="kw">for</span> <span class="ty">HelloPlugin</span> {`,
      `    <span class="kw">fn</span> <span class="fn">build</span>(&amp;<span class="kw">self</span>, app: &amp;<span class="kw">mut</span> <span class="ty">App</span>) {`,
      `        app.<span class="fn">insert_resource</span>(<span class="ty">GreetTimer</span>(<span class="ty">Timer</span>::<span class="fn">from_seconds</span>(<span class="num">2.0</span>, <span class="ty">TimerMode</span>::<span class="ty">Repeating</span>)));`,
      `        app.<span class="fn">add_systems</span>(<span class="ty">Startup</span>, add_people);`,
      `        app.<span class="fn">add_systems</span>(<span class="ty">Update</span>, (update_people, greet_people).<span class="fn">chain</span>());`,
      `    }`,
      `}`,
      ``,
      `<span class="attr">#[derive(<span class="ty">Component</span>)]</span>`,
      `<span class="kw">struct</span> <span class="ty">Person</span>;`,
      ``,
      `<span class="attr">#[derive(<span class="ty">Component</span>)]</span>`,
      `<span class="kw">struct</span> <span class="ty">Name</span>(<span class="ty">String</span>);`,
      ``,
      `<span class="kw">fn</span> <span class="fn">add_people</span>(<span class="kw">mut</span> commands: <span class="ty">Commands</span>) {`,
      `    commands.<span class="fn">spawn</span>((<span class="ty">Person</span>, <span class="ty">Name</span>(<span class="str">"Elaina Proctor"</span>.<span class="fn">to_string</span>())));`,
      `    commands.<span class="fn">spawn</span>((<span class="ty">Person</span>, <span class="ty">Name</span>(<span class="str">"Renzo Hume"</span>.<span class="fn">to_string</span>())));`,
      `    commands.<span class="fn">spawn</span>((<span class="ty">Person</span>, <span class="ty">Name</span>(<span class="str">"Zayna Nieves"</span>.<span class="fn">to_string</span>())));`,
      `}`,
      ``,
      `<span class="kw">fn</span> <span class="fn">update_people</span>(<span class="kw">mut</span> query: <span class="ty">Query</span>&lt;&amp;<span class="kw">mut</span> <span class="ty">Name</span>, <span class="ty">With</span>&lt;<span class="ty">Person</span>&gt;&gt;) {`,
      `    <span class="kw">for</span> <span class="kw">mut</span> name <span class="kw">in</span> &amp;<span class="kw">mut</span> query {`,
      `        <span class="kw">if</span> name.<span class="num">0</span> == <span class="str">"Elaina Proctor"</span> {`,
      `            name.<span class="num">0</span> = <span class="str">"Elaina Hume"</span>.<span class="fn">to_string</span>();`,
      `            <span class="kw">break</span>;`,
      `        }`,
      `    }`,
      `}`,
      ``,
      `<span class="attr">#[derive(<span class="ty">Resource</span>)]</span>`,
      `<span class="kw">struct</span> <span class="ty">GreetTimer</span>(<span class="ty">Timer</span>);`,
      ``,
      `<span class="kw">fn</span> <span class="fn">greet_people</span>(time: <span class="ty">Res</span>&lt;<span class="ty">Time</span>&gt;, <span class="kw">mut</span> timer: <span class="ty">ResMut</span>&lt;<span class="ty">GreetTimer</span>&gt;, query: <span class="ty">Query</span>&lt;&amp;<span class="ty">Name</span>, <span class="ty">With</span>&lt;<span class="ty">Person</span>&gt;&gt;) {`,

            body: "<code>timer.0</code> dereferences <code>ResMut&lt;GreetTimer&gt;</code> to access the inner <code>Timer</code>. <code>.tick(duration)</code> mutates the timer in place and returns <code>&mut Timer</code>, allowing <code>.just_finished()</code> (returning <code>bool</code>) to be chained right onto it."
          }
        ]
      },
      46: {
        section: "Update System (Read + Timer)",
        title: "Immutable iteration over a query",
        summary: "Borrows `query` immutably and yields `&Name` for each matching entity.",
        concepts: ["ownership", "expr"],
        items: [
          {
            token: "for name in &query",
            concept: "ownership",
            heading: "Shared borrow iteration",
            body: "<code>&query</code> creates a shared borrow, yielding immutable <code>&Name</code> references. Notice neither <code>query</code> nor <code>name</code> needs <code>mut</code>."
          }
        ]
      },
      47: {
        section: "Update System (Read + Timer)",
        title: "Macros (`!`), compile-time format checks & omitted `;`",
        summary: "Prints each person's name to stdout.",
        concepts: ["macros", "expr", "traits"],
        items: [
          {
            token: "println!(...)",
            concept: "macros",
            heading: "The `!` macro sigil",
            body: "Any call ending in <code>!</code> is a <strong>macro</strong>, not a function. Rust doesn't have variadic functions; macros fill that role and expand at compile time. <code>println!</code> verifies at compile time that the number and types of arguments match the format string."
          },
          {
            token: "\"hello {}\", name.0",
            concept: "traits",
            heading: "Format placeholders & the Display trait",
            body: "<code>{}</code> formats a value using the <code>std::fmt::Display</code> trait (user-facing text). For debugging arbitrary structs, you'd use <code>{:?}</code> with the <code>Debug</code> trait. Also note Rust's auto-deref: <code>name</code> is <code>&Name</code>, and <code>name.0</code> automatically dereferences the reference."
          },
          {
            token: "(no trailing ;)",
            concept: "expr",
            heading: "Expression-oriented blocks",
            body: "There is no semicolon at the end of this line! Because <code>println!(...)</code> evaluates to <code>()</code>, and a <code>for</code> loop body must evaluate to <code>()</code>, omitting the <code>;</code> still compiles. Idiomatic Rust usually keeps the <code>;</code> for side-effect statements."
          }
        ]
      },
      52: {
        section: "Unused Function",
        title: "Private unused function (`dead_code`)",
        summary: "An uncalled private helper left over from earlier in the Bevy tutorial.",
        concepts: ["modules", "expr"],
        items: [
          {
            token: "fn hello_world()",
            concept: "modules",
            heading: "Compiler dead-code analysis",
            body: "Because <code>hello_world</code> is private (no <code>pub</code>) and never referenced in this crate, <code>rustc</code> will emit a helpful <code>warning: function `hello_world` is never used</code> at compile time."
          }
        ]
      },
      53: {
        section: "Unused Function",
        title: "Implicit return of `()`",
        summary: "Prints a greeting; the omitted semicolon returns `()` from the function.",
        concepts: ["macros", "expr"],
        items: [
          {
            token: "println!(\"hello world!\")",
            concept: "expr",
            heading: "Last expression is the return value",
            body: "In Rust, you don't need the <code>return</code> keyword at the end of a function—the final expression without a semicolon is automatically returned. Here <code>println!</code> returns <code>()</code>, which matches <code>hello_world()</code>'s implicit <code>()</code> return type."
          }
        ]
      }
    };

    const annotatedLineNumbers = Object.keys(ANNOTATIONS).map(Number).sort((a, b) => a - b);

    // State
    let selectedLine = annotatedLineNumbers[0];
    let activeFilter = "all";

    // DOM refs
    const filterBar = document.getElementById("filterBar");
    const codeContainer = document.getElementById("codeContainer");
    const inspectorBody = document.getElementById("inspectorBody");
    const sectionLabel = document.getElementById("sectionLabel");
    const filterStatus = document.getElementById("filterStatus");
    const progressText = document.getElementById("progressText");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const themeToggle = document.getElementById("themeToggle");

    function getFilteredLines() {
      if (activeFilter === "all") return annotatedLineNumbers;
      return annotatedLineNumbers.filter(ln => ANNOTATIONS[ln].concepts.includes(activeFilter));
    }

    function renderFilters() {
      // Preserve label
      filterBar.innerHTML = `<span class="filter-label">Concepts</span>`;

      const allPill = document.createElement("button");
      allPill.type = "button";
      allPill.className = `pill ${activeFilter === "all" ? "active" : ""}`;
      allPill.innerHTML = `All <span class="count">${annotatedLineNumbers.length}</span>`;
      allPill.addEventListener("click", () => setFilter("all"));
      filterBar.appendChild(allPill);

      for (const [key, meta] of Object.entries(CONCEPTS)) {
        const count = annotatedLineNumbers.filter(ln => ANNOTATIONS[ln].concepts.includes(key)).length;
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = `pill ${activeFilter === key ? "active" : ""}`;
        pill.innerHTML = `<span class="dot" style="background:${meta.color}"></span>${meta.label} <span class="count">${count}</span>`;
        pill.addEventListener("click", () => setFilter(activeFilter === key ? "all" : key));
        filterBar.appendChild(pill);
      }
    }

    function renderCode() {
      codeContainer.innerHTML = "";
      const matching = new Set(getFilteredLines());

      SOURCE_LINES.forEach((raw, idx) => {
        const ln = idx + 1;
        const ann = ANNOTATIONS[ln];
        const row = document.createElement("div");
        row.className = "code-line";
        row.dataset.line = ln;

        if (ann) {
          row.classList.add("annotated");
          row.addEventListener("click", () => selectLine(ln));
        }

        if (activeFilter !== "all") {
          if (matching.has(ln)) {
            row.classList.add("filter-match");
          } else {
            row.classList.add("filter-dim");
          }
        }

        if (ln === selectedLine) {
          row.classList.add("selected");
        }

        const lnSpan = document.createElement("span");
        lnSpan.className = "ln";
        lnSpan.textContent = ln;

        const codeSpan = document.createElement("span");
        codeSpan.className = "code-text";
        codeSpan.innerHTML = HIGHLIGHTED_LINES[idx] || " ";

        row.appendChild(lnSpan);
        row.appendChild(codeSpan);

        if (ann) {
          const dots = document.createElement("span");
          dots.className = "line-dots";
          ann.concepts.forEach(c => {
            const d = document.createElement("span");
            d.className = "line-dot";
            d.style.background = CONCEPTS[c].color;
            d.title = CONCEPTS[c].label;
            dots.appendChild(d);
          });
          row.appendChild(dots);
        }

        codeContainer.appendChild(row);
      });

      if (activeFilter === "all") {
        filterStatus.textContent = `${annotatedLineNumbers.length} annotated lines · click any line`;
      } else {
        filterStatus.textContent = `${matching.size} lines match "${CONCEPTS[activeFilter].label}"`;
      }
    }

    function renderInspector() {
      const ann = ANNOTATIONS[selectedLine];
      if (!ann) return;

      sectionLabel.textContent = ann.section;

      const tagsHtml = ann.concepts.map(c => {
        const meta = CONCEPTS[c];
        return `<button type="button" class="tag" data-concept="${c}">
          <span class="dot" style="width:7px;height:7px;border-radius:50%;background:${meta.color}"></span>
          ${meta.label}
        </button>`;
      }).join("");

      const cardsHtml = ann.items.map(item => {
        const meta = CONCEPTS[item.concept];
        return `
          <article class="card">
            <div class="card-header">
              <span class="token-chip">${escapeHtml(item.token)}</span>
              <span class="card-concept" style="color:${meta.color}">${meta.label}</span>
            </div>
            <h3>${item.heading}</h3>
            <p>${item.body}</p>
            ${item.callout ? `<div class="callout">${item.callout}</div>` : ""}
          </article>
        `;
      }).join("");

      inspectorBody.innerHTML = `
        <div class="line-banner">
          <div class="line-meta">
            <h2 class="line-title">${ann.title}</h2>
            <span class="line-badge">Line ${selectedLine}</span>
          </div>
          <div class="snippet-box">${HIGHLIGHTED_LINES[selectedLine - 1].trim()}</div>
          <p class="line-summary">${ann.summary}</p>
          <div class="tag-row">${tagsHtml}</div>
        </div>
        <div class="cards">${cardsHtml}</div>
      `;

      // Make concept tags inside the inspector clickable filters
      inspectorBody.querySelectorAll(".tag").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.dataset.concept;
          setFilter(activeFilter === c ? "all" : c);
        });
      });

      // Update footer nav
      const navList = getFilteredLines();
      const idx = navList.indexOf(selectedLine);
      if (idx === -1) {
        progressText.textContent = `Line ${selectedLine}`;
        prevBtn.disabled = false;
        nextBtn.disabled = false;
      } else {
        progressText.textContent = `Step ${idx + 1} / ${navList.length} (Line ${selectedLine})`;
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === navList.length - 1;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function selectLine(ln, scrollIntoView = false) {
      selectedLine = ln;
      renderCode();
      renderInspector();
      inspectorBody.scrollTop = 0;

      if (scrollIntoView) {
        const el = codeContainer.querySelector(`.code-line[data-line="${ln}"]`);
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    function setFilter(filterKey) {
      activeFilter = filterKey;
      const list = getFilteredLines();
      if (list.length > 0 && !list.includes(selectedLine)) {
        selectedLine = list[0];
      }
      renderFilters();
      renderCode();
      renderInspector();
      const el = codeContainer.querySelector(`.code-line[data-line="${selectedLine}"]`);
      if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function step(delta) {
      const list = getFilteredLines();
      if (!list.length) return;
      const idx = list.indexOf(selectedLine);
      if (idx === -1) {
        selectLine(list[0], true);
        return;
      }
      const nextIdx = Math.max(0, Math.min(list.length - 1, idx + delta));
      if (nextIdx !== idx) {
        selectLine(list[nextIdx], true);
      }
    }

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowDown" || e.key === "j") {
        e.preventDefault();
        step(1);
      } else if (e.key === "ArrowUp" || e.key === "k") {
        e.preventDefault();
        step(-1);
      }
    });

    themeToggle.addEventListener("click", () => {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      if (isLight) {
        document.documentElement.removeAttribute("data-theme");
        themeToggle.textContent = "Light theme";
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        themeToggle.textContent = "Dark theme";
      }
    });

    // Initial render
    renderFilters();
    renderCode();
    renderInspector();
  </script>
</body>
</html>
